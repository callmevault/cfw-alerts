name: CFW alerts

on:
  schedule:
    - cron: "47 16 * * *"  # every day at 16:47 UTC, after altstrument's daily update (~14:00-15:40 UTC)
    # Backups: GitHub can delay or drop scheduled runs. When the 16:47 run
    # already reported everything, these find nothing new and stay silent.
    - cron: "47 19 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# This is all the access the workflow needs; no repository settings have to change.
permissions:
  contents: write  # save state.json to the "state" branch
  issues: write    # open the daily issue and create the "digest" label

concurrency:
  group: cfw-alerts
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Date the digest
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # GitHub often starts scheduled runs hours late, sometimes after midnight
          # UTC, so a scheduled run is dated by the day it was due, not the day it started.
          now=$(date -u +%s)
          due=$now
          if [ -n "$SCHEDULE" ]; then
            read -r minute hour _ <<< "$SCHEDULE"
            if due=$(date -u -d "$(date -u +%F) $hour:$minute" +%s 2> /dev/null); then
              [ "$due" -le "$now" ] || due=$((due - 86400))
              echo "Due $(date -u -d "@$due" '+%F %H:%M') UTC, started $(( (now - due) / 60 )) minutes late."
            else
              due=$now
            fi
          fi
          echo "DIGEST_DAY=$(date -u -d "@$due" +%F)" >> "$GITHUB_ENV"

      - name: Load the previous run's state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # state.json lives on its own "state" branch so main holds only code.
          if git ls-remote --exit-code origin refs/heads/state > /dev/null; then
            git fetch --depth=1 origin +refs/heads/state:refs/remotes/origin/state
            git show origin/state:state.json > state.json
            exit 0
          fi
          # First run of a copy made from the template: start from the template's
          # state as saved 1 to 3 days ago, so this run already opens an issue
          # with the last day's changes that pass your filters.
          # (gh prints the error body on failure, hence "|| x=" rather than "|| true".)
          template=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.template_repository.full_name // empty' 2> /dev/null) || template=""
          since=$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          until=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          sha=""
          if [ -n "$template" ]; then
            sha=$(gh api "repos/$template/commits?sha=state&since=$since&until=$until&per_page=1" \
              --jq '.[0].sha // empty' 2> /dev/null) || sha=""
          fi
          # The template's download tag is dropped so the catalog is always fetched.
          if [ -n "$sha" ] \
            && gh api -H "Accept: application/vnd.github.raw" "repos/$template/contents/state.json?ref=$sha" > seed.json 2> /dev/null \
            && jq 'del(.catalog_etag)' seed.json > state.json; then
            echo "FIRST_RUN_SAMPLE=1" >> "$GITHUB_ENV"
            echo "First run: comparing with $template as saved before $until."
          else
            rm -f state.json
            echo "No state branch yet; this run records the baseline."
          fi
          rm -f seed.json

      - name: Compare catalog with the previous run
        run: python alerts.py

      - name: Open or add to the daily issue
        if: hashFiles('digest.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CFW digest $DIGEST_DAY"
          if [ -n "${FIRST_RUN_SAMPLE:-}" ]; then
            { echo "_First run: a sample of the last day's changes that pass your filters. From now on a digest arrives on each day with news._"
              echo
              cat digest.md; } > first-run.md
            mv first-run.md digest.md
          fi
          # A later run for the same day comments on that day's issue instead
          # of opening a second one.
          number=$(gh issue list --state all --limit 30 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file digest.md
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/labels/digest" --silent 2> /dev/null \
            || gh label create digest --color 0e8a16 --description "Daily CFW digest"
          # Mention the owner so GitHub emails them the digest and any later
          # comments. (Assigning them would send a second email about the
          # assignment.) Nobody is mentioned when the owner is an organisation
          # (members watch the repo) or in a template repository, the public
          # feed people follow by watching.
          repo=$(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.is_template) \(.owner.type)"')
          if [ "$repo" = "false User" ]; then
            printf '\ncc @%s\n' "$GITHUB_REPOSITORY_OWNER" >> digest.md
          fi
          gh issue create --title "$title" --body-file digest.md --label digest

      - name: Save state to the state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(printf '100644 blob %s\tstate.json\n' "$(git hash-object -w state.json)" | git mktree)
          if parent=$(git rev-parse -q --verify refs/remotes/origin/state); then
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "State unchanged."
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p "$parent" -m "Update catalog state")
          else
            commit=$(git commit-tree "$tree" -m "Start catalog state")
          fi
          git push origin "$commit:refs/heads/state"
